spring.application.name=lessons-of-wellbeing
server.port = 8080
spring.profiles.active = h2

api-endpoint=/api/v1

spring.config.import=optional:file:./.env[.properties]
jwt.secret=${JWT_SECRET}
jwt.issuer=lessons-of-wellbeing
jwt.expires-in-seconds=900
demo.user.email=${DEMO_USER_EMAIL:demo@example.com}
demo.user.password=${DEMO_USER_PASSWORD:}
